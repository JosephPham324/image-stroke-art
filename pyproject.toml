[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-mosaic"
version = "0.1.0"
description = "Composition-Aware Image Brush Mosaic Generator"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Antigravity Vision Team" }
]
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "scikit-image>=0.22.0",
    "scipy>=1.11.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
image-mosaic = "image_mosaic.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
